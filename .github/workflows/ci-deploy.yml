name: CI and GitHub Pages deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repzena-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.53.1

      - name: Install project dependencies and browser
        run: task install:ci

      - name: Run checks, browser tests, and build
        run: task ci

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload deployment site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish to the Pages repository
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repzena-pages-production
      cancel-in-progress: false
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Check deployment configuration
        env:
          PAGES_BRANCH: ${{ vars.PAGES_BRANCH || 'main' }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "Set the APP_ID and APP_PRIVATE_KEY Actions secrets for a GitHub App installed on repzena/repzena.github.io." >&2
            exit 1
          fi
          if ! git check-ref-format --branch "$PAGES_BRANCH" >/dev/null; then
            echo "PAGES_BRANCH must be a valid Git branch name." >&2
            exit 1
          fi

      - name: Get App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: repzena.github.io

      - name: Check out Pages repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/repzena.github.io
          ref: ${{ vars.PAGES_BRANCH || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
          path: pages
          fetch-depth: 1

      - name: Publish built site
        env:
          PAGES_BRANCH: ${{ vars.PAGES_BRANCH || 'main' }}
        run: |
          rsync -a --delete --exclude='.git/' --exclude='CNAME' dist/ pages/
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add --all
          if git -C pages diff --cached --quiet; then
            echo "The Pages repository already has this build."
            exit 0
          fi
          git -C pages commit -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git -C pages push origin "HEAD:${PAGES_BRANCH}"
